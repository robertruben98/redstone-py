[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redstone-py"
version = "0.1.0"
description = "Typed sync + async Python client for the RedStone oracle HTTP API (modular pull price feeds)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Robert Ruben" }]
keywords = ["redstone", "oracle", "price-feed", "defi", "blockchain", "httpx", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/robertruben98/redstone-py"
Repository = "https://github.com/robertruben98/redstone-py"
Documentation = "https://docs.redstone.finance"
Issues = "https://github.com/robertruben98/redstone-py/issues"
Changelog = "https://github.com/robertruben98/redstone-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redstone"]

[tool.hatch.build.targets.sdist]
include = ["src/redstone", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live network tests against the real RedStone API (deselected by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
# UP007/UP045 would rewrite Optional[X]/Union to PEP 604 `X | None`,
# which is invalid at runtime on Python 3.9 for pydantic models.
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
